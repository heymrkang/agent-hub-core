name: Phase 11 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase11-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark V1 released in project plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.plan/PROJECT_PLAN.md')
          text = p.read_text()
          text = text.replace('> **Document Version:** v0.1\\', '> **Document Version:** v1.0\\', 1)
          text = text.replace('> **Status:** V1 Planning Baseline\\', '> **Status:** V1 Released\\', 1)
          p.write_text(text)
          PY
          git rm .github/workflows/phase11-finalize.yml
      - name: Commit final release baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .plan/PROJECT_PLAN.md
          git commit -m '08S6 Finalize V1 project plan' || exit 0
          git push
