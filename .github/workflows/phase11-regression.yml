name: Phase 11 Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        # Legacy package-lock predates better-sqlite3/sharp additions. Phase 11
        # regression must still execute while the lockfile is repaired separately.
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
