services:
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-agent-telegram
    restart: unless-stopped
    volumes:
      - /mnt/storage/agent-hub-core/data:/data
      - /mnt/storage/agent-hub-core/providers/codex:/root/.codex
      - /mnt/storage/agent-hub-core/providers/gemini:/root/.gemini
      - /mnt/storage/agent-hub-core/dev:/home/dev
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify Environment}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in Coolify Environment}"
      CODEX_TIMEOUT_MS: "${CODEX_TIMEOUT_MS:-120000}"
      ANTIGRAVITY_TIMEOUT_MS: "${ANTIGRAVITY_TIMEOUT_MS:-120000}"
      ANTIGRAVITY_MODEL_DISCOVERY_TIMEOUT_MS: "${ANTIGRAVITY_MODEL_DISCOVERY_TIMEOUT_MS:-60000}"
      EXECUTION_TAIL_SIZE: "${EXECUTION_TAIL_SIZE:-3}"
      CODEX_CONCURRENCY: "${CODEX_CONCURRENCY:-2}"
      ANTIGRAVITY_CONCURRENCY: "${ANTIGRAVITY_CONCURRENCY:-2}"
      MODEL_REFRESH_INTERVAL_SECONDS: "${MODEL_REFRESH_INTERVAL_SECONDS:-21600}"
      SCHEDULER_QUEUE_GRACE_SECONDS: "${SCHEDULER_QUEUE_GRACE_SECONDS:-30}"
      WORKSPACE_DIR: /home/dev
      DATA_DIR: /data
      TZ: Asia/Seoul
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
      GH_TOKEN: "${GH_TOKEN:?Set GH_TOKEN in Coolify Environment}"
      GIT_USER_NAME: mrkang
      GIT_USER_EMAIL: heymrkangx@google.com
      REPOS_ROOT: /home/dev/workspace
      SSH_DATA_DIR: /data/ssh
      PREVIEW_INTERNAL_TOKEN: "${PREVIEW_INTERNAL_TOKEN:?Set PREVIEW_INTERNAL_TOKEN in Coolify Environment}"
      PREVIEW_TUNNEL_ONLY: "${PREVIEW_TUNNEL_ONLY:-false}"
      PREVIEW_CLOUDFLARE_TEAM_DOMAIN: "${PREVIEW_CLOUDFLARE_TEAM_DOMAIN:-}"
      PREVIEW_CLOUDFLARE_ACCESS_AUD: "${PREVIEW_CLOUDFLARE_ACCESS_AUD:-}"
      WEBHOOK_PORT: "8788"
      WEBHOOK_HOST: "0.0.0.0"
      COOLIFY_API_TOKEN: "${COOLIFY_API_TOKEN:-}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.agent-hub-webhook.priority: "2"
      traefik.http.routers.agent-hub-webhook.entrypoints: http
      traefik.http.routers.agent-hub-webhook.rule: "Host(`agent-hub.12190529.xyz`)"
      traefik.http.routers.agent-hub-webhook.service: agent-hub-webhook
      traefik.http.services.agent-hub-webhook.loadbalancer.server.port: "8788"
    networks:
      - default
      - coolify

  preview-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - node
      - src/preview/gateway-server.js
    environment:
      PREVIEW_ROUTE_API: http://agent-telegram:8790
      PREVIEW_GATEWAY_HOST: 0.0.0.0
      PREVIEW_GATEWAY_PORT: "8080"
      PREVIEW_INTERNAL_TOKEN: "${PREVIEW_INTERNAL_TOKEN:?Set PREVIEW_INTERNAL_TOKEN in Coolify Environment}"
    depends_on:
      - agent-telegram

    # Dockerfile의 8787 헬스체크를 Gateway용으로 덮어쓴다.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/health')
          .then(()=>process.exit(0))
          .catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.agent-hub-preview.priority: "1"
      traefik.http.routers.agent-hub-preview.entrypoints: http
      traefik.http.routers.agent-hub-preview.rule: "HostRegexp(`preview-[a-z0-9-]+\\.12190529\\.xyz`)"
      traefik.http.routers.agent-hub-preview.service: agent-hub-preview
      traefik.http.services.agent-hub-preview.loadbalancer.server.port: "8080"
    networks:
      - default
      - preview
      - coolify

networks:
  preview:
    name: agent-hub-preview
    labels:
      agent-hub.managed: "true"
      agent-hub.type: preview-network

  # 호스트 포트는 열지 않고 Coolify Traefik 내부망만 사용한다.
  coolify:
    external: true
