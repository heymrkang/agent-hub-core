services:
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-agent-telegram
    restart: unless-stopped
    volumes:
      - /mnt/storage/agent-hub-core/data:/data
      - /mnt/storage/agent-hub-core/providers/codex:/root/.codex
      - /mnt/storage/agent-hub-core/providers/gemini:/root/.gemini
      # 호스트의 dev 디렉토리는 유지하되 Linux 예약 경로 /dev를 덮어쓰지 않는다.
      - /mnt/storage/agent-hub-core/dev:/home/dev
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify Environment}"
      TELEGRAM_ALLOWED_USER_IDS: "8418085671"
      CODEX_TIMEOUT_MS: "600000"
      WORKSPACE_DIR: /home/dev
      DATA_DIR: /data
      TZ: Asia/Seoul
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
      GH_TOKEN: "${GH_TOKEN:?Set GH_TOKEN in Coolify Environment}"
      GIT_USER_NAME: mrkang
      GIT_USER_EMAIL: heymrkangx@google.com
      REPOS_ROOT: /home/dev/workspace
      SSH_DATA_DIR: /data/ssh
    networks:
      - default

  preview-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/preview/gateway-server.js"]
    environment:
      PREVIEW_ROUTE_API: http://agent-telegram:8790
      PREVIEW_GATEWAY_HOST: 0.0.0.0
      PREVIEW_GATEWAY_PORT: "8080"
    depends_on:
      - agent-telegram
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      # Exact-host Coolify routes keep precedence over this catch-all preview route.
      traefik.http.routers.agent-hub-preview.priority: "1"
      traefik.http.routers.agent-hub-preview.entrypoints: http
      traefik.http.routers.agent-hub-preview.rule: "HostRegexp(`[a-z0-9-]+\\.${PREVIEW_DOMAIN:-12190529.xyz}`)"
      traefik.http.routers.agent-hub-preview.service: agent-hub-preview
      traefik.http.services.agent-hub-preview.loadbalancer.server.port: "8080"
    networks:
      - default
      - preview
      - coolify

networks:
  preview:
    name: agent-hub-preview
    labels:
      agent-hub.managed: "true"
      agent-hub.type: preview-network
  # Coolify's Traefik discovers the gateway through this shared internal network.
  # No host port is published; Cloudflare Tunnel remains the only external ingress.
  coolify:
    external: true
