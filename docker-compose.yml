services:
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-agent-telegram
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./data/providers/codex:/root/.codex
      - ./data/providers/antigravity:/root/.gemini
      # 호스트의 dev 디렉토리는 유지하되 Linux 예약 경로 /dev를 덮어쓰지 않는다.
      - ./dev:/home/dev
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul
      - WORKSPACE_DIR=/home/dev
      - REPOS_ROOT=/home/dev/workspace
      - DATA_DIR=/data
      - SSH_DATA_DIR=/data/ssh
