services:
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-agent-telegram
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./data/providers/codex:/root/.codex
      - ./data/providers/antigravity:/root/.gemini
      # 범용 개발 공간. Git 프로젝트는 관례적으로 /dev/workspace 아래에 둔다.
      - ./dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Seoul
      - WORKSPACE_DIR=/dev
      - REPOS_ROOT=/dev/workspace
      - DATA_DIR=/data
      - SSH_DATA_DIR=/data/ssh
