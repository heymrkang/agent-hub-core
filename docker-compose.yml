services:
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-agent-telegram
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 영속 데이터 전체 마운트
      - ./data:/data
      # Codex 인증 세션 영속화 (/data 하위로 수렴)
      - ./data/providers/codex:/root/.codex
      # 작업 컨텍스트 / 워크스페이스
      - ./workspace:/workspace
    environment:
      - TZ=Asia/Seoul
      - WORKSPACE_DIR=/workspace
      - DATA_DIR=/data
